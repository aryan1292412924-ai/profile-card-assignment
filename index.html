<!DOCTYPE html>
<html>

<head>
    <title>My Profile Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="theme-buttons">
        <button onclick="setLight()">Light</button>
        <button onclick="setDark()">Dark</button>
    </div>
    <div class="card">
        <div class="profile-image">
            <img id="profile-pic" src="dark.jpeg" alt="Profile Picture">
            <img src="superman.jpeg" class="light-image" alt="Profile Picture">
        </div>
        <h1>Aryan</h1>
        <p class="bio">
            Some wear the symbol of hope. Others become the symbol of fear. Every legend has a story.
            <a href="https://www.dc.com/">Dive right in the world of DC COMICS</a>.
        </p>
        <a href="mailto:aryan1292412924@gmail.com" class="contact-button">
            Get in touch
        </a>
        <div class="social-links">
            <a href="https://www.instagram.com/">
                <img src="instagram.svg" alt="Instagram">
            </a>
            <a href="https://email.com/">
                <img src="email.svg" alt="email">
            </a>
            <a href="https://www.tiktok.com/">
                <img src="tiktok.svg" alt="tiktok">
            </a>
            <a href="https://www.twitter.com/">
                <img src="twitter.svg" alt="twitter">
            </a>
            <a href="https://www.dc.com/">
                <img src="website.svg" alt="website">
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
